name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ホスト側ユニットテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd tests && make

  build-firmware:
    name: ファームウェアビルド (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/build_docker.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-uf2
          path: |
            build/genshin_midi_kbd.uf2
            build/serial_midi_device.uf2
          if-no-files-found: error

  build-gerbers:
    name: 基板製造データ生成 (KiCad 10.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DRC と Gerber を生成
        run: >-
          docker run --rm
          --volume "$PWD:/work" --workdir /work
          ghcr.io/kicad/kicad:10.0.5
          ./scripts/build_gerbers.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-release
          path: |
            build/release/rp2350_zero_carrier_gerbers_JLCPCB.zip
            build/release/rp2350_zero_carrier-drc.rpt
            build/release/rp2350_zero_carrier-schematic.pdf
            build/release/rp2350_zero_carrier-layout.pdf
            build/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: GitHub Release 作成
    needs: [test, build-firmware, build-gerbers]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create でのアセット添付に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-uf2
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hardware-release
          path: build/release
      - name: release checksums
        run: |
          cd build
          sha256sum \
            genshin_midi_kbd.uf2 serial_midi_device.uf2 \
            release/rp2350_zero_carrier_gerbers_JLCPCB.zip \
            release/rp2350_zero_carrier-drc.rpt \
            release/rp2350_zero_carrier-schematic.pdf \
            release/rp2350_zero_carrier-layout.pdf \
            > release/SHA256SUMS.txt
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/genshin_midi_kbd.uf2 build/serial_midi_device.uf2 \
            build/release/rp2350_zero_carrier_gerbers_JLCPCB.zip \
            build/release/rp2350_zero_carrier-drc.rpt \
            build/release/rp2350_zero_carrier-schematic.pdf \
            build/release/rp2350_zero_carrier-layout.pdf \
            build/release/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
